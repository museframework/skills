name: Validate migration skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python scripts
        run: python -m compileall -q mulesoft-to-muse/scripts
      - name: Run skill tests
        run: python -m unittest discover -s mulesoft-to-muse/tests -v
